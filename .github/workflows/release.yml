name: Build and publish QuotaDock

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and validate version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION: $version" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Tag does not match VERSION" }
          "QUOTADOCK_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: .\packaging\build.ps1 -Clean

      - name: Build direct update package
        shell: pwsh
        run: .\packaging\build_update_package.ps1 -Clean

      - name: Create checksum
        shell: pwsh
        run: |
          $payload = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in @('.exe', '.zip') })
          if ($payload.Count -lt 2 -or -not ($payload.Name -like 'QuotaDock-Setup-*.exe')) {
            throw 'Release payload must contain both the Windows installer and the portable/update ZIP.'
          }
          $lines = foreach ($file in $payload) {
            (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + "  " + $file.Name
          }
          $lines | Set-Content dist\SHA256SUMS.txt -Encoding UTF8

      - name: Verify installer payload
        shell: pwsh
        run: |
          $version = $env:QUOTADOCK_VERSION
          $installer = Join-Path $pwd "dist\QuotaDock-Setup-$version.exe"
          $portable = Join-Path $pwd "dist\QuotaDock-v$version.zip"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Missing installer: $installer" }
          if (-not (Test-Path -LiteralPath $portable)) { throw "Missing portable/update ZIP: $portable" }
          if ((Get-Item -LiteralPath $installer).Length -lt 100KB) { throw 'Installer is unexpectedly small.' }
          Write-Output "INSTALLER=$installer"
          Write-Output "PORTABLE=$portable"

      - name: Verify generated update manifest
        shell: pwsh
        run: |
          $version = $env:QUOTADOCK_VERSION
          $manifest = Get-Content -LiteralPath (Join-Path $pwd 'update-manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $portable = Join-Path $pwd "dist\QuotaDock-v$version.zip"
          $actualSha256 = (Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          if ([string]$manifest.version -ne $version) { throw "Manifest version mismatch: $($manifest.version) / $version" }
          if ([string]$manifest.sha256 -ne $actualSha256) { throw "Manifest SHA-256 mismatch: $($manifest.sha256) / $actualSha256" }
          Write-Output "UPDATE_MANIFEST_SHA256=$actualSha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuotaDock-${{ env.QUOTADOCK_VERSION }}
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in @('.exe', '.zip', '.txt') })
          $files += Get-Item -LiteralPath (Join-Path $pwd 'update-manifest.json')
          $notes = Join-Path $pwd "docs\releases\v$env:QUOTADOCK_VERSION.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing release notes: $notes" }
          $args = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            '--repo', $env:GITHUB_REPOSITORY,
            '--verify-tag',
            '--title', "QuotaDock $env:QUOTADOCK_VERSION · Windows 首发",
            '--notes-file', $notes
          )
          $args += @($files.FullName)
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }

      - name: Publish current update manifest to main
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:QUOTADOCK_VERSION
          $manifestPath = Join-Path $pwd 'update-manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath)) { throw "Missing generated update manifest: $manifestPath" }
          $manifestJson = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8
          $manifest = $manifestJson | ConvertFrom-Json
          if ([string]$manifest.version -ne $version) { throw "Generated manifest version does not match VERSION: $($manifest.version) / $version" }
          if ([string]$manifest.downloadUrl -notmatch ('/releases/download/v' + [regex]::Escape($version) + '/QuotaDock-v' + [regex]::Escape($version) + '\.zip$')) {
            throw 'Generated manifest must point to the versioned GitHub Release asset.'
          }
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($manifestJson))
          $current = gh api "repos/$env:GITHUB_REPOSITORY/contents/update-manifest.json?ref=main" | ConvertFrom-Json
          $request = [ordered]@{
            message = "chore: publish update manifest for v$version"
            content = $encoded
            branch  = 'main'
            sha     = [string]$current.sha
          } | ConvertTo-Json -Compress
          $response = $request | gh api "repos/$env:GITHUB_REPOSITORY/contents/update-manifest.json" --method PUT --input - | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$response.commit.sha)) { throw 'GitHub did not return the update-manifest commit.' }
          Write-Output "UPDATE_MANIFEST_PUBLISHED=$($response.commit.sha)"
