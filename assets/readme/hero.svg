<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">QuotaDock</title>
  <desc id="d">QuotaDock：把 Codex、Grok、OpenCode 额度贴在桌面边缘，卡片可分可合。</desc>
  <defs><clipPath id="c"><rect width="1200" height="400" rx="26"/></clipPath></defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="400" fill="#0c1117"/>
    <text x="56" y="64" fill="#8c9aaa" font-size="16" font-family="Segoe UI, sans-serif">DESKTOP OVERLAY  ·  LOCAL FIRST</text>
    <rect x="56" y="76" width="56" height="6" rx="3" fill="#4da3ff"/>
    <text x="56" y="160" fill="#e8eef5" font-size="52" font-weight="700" font-family="Microsoft YaHei, Segoe UI, sans-serif">QuotaDock</text>
    <rect x="56" y="178" width="220" height="10" rx="5" fill="#3ddc97"/>
    <text x="56" y="230" fill="#e8eef5" font-size="20" font-family="Microsoft YaHei, sans-serif">额度浮窗，可分可合。</text>
    <text x="56" y="348" fill="#8c9aaa" font-size="14" font-family="Consolas, monospace">CODEX  ·  GROK  ·  OPENCODE</text>
  </g>
</svg>
